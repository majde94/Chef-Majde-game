<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chef Majde Game</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#111827;
  color:white;
  text-align:center
}
.wrap{max-width:500px;margin:auto;padding:20px}
button{
  font-size:20px;
  padding:16px;
  margin:8px;
  border:0;
  border-radius:14px;
  font-weight:bold
}
.green{background:#22c55e;color:white}
.orange{background:#f59e0b;color:white}
.food{
  width:30%;
  background:#1f2937;
  color:white;
  border:2px solid #475569
}
.ready{
  background:#166534!important;
  border-color:#22c55e!important
}
#customer{font-size:70px}
#order{font-size:28px;margin:10px}
#bar{
  height:15px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden
}
#fill{
  height:100%;
  background:#22c55e;
  width:100%
}
.top{display:flex;justify-content:space-around;font-size:18px;margin-bottom:15px}
.hidden{display:none}
</style>
</head>
<body>

<div class="wrap">
  <h1>👨‍🍳 Chef Majde</h1>
  <h2>Restaurant Rush</h2>

  <div id="home">
    <button class="green" onclick="startGame()">▶ PLAY</button>
  </div>

  <div id="game" class="hidden">
    <div class="top">
      <div>⏱ <span id="time">60</span></div>
      <div>🪙 <span id="coins">0</span></div>
      <div>✅ <span id="served">0</span>/5</div>
    </div>

    <div id="customer">🙂</div>
    <div>Customer wants:</div>
    <div id="order">🍔 Burger</div>

    <div id="bar"><div id="fill"></div></div>

    <h3>Kitchen</h3>

    <button id="burger" class="food" onclick="cook('burger')">🍔<br>Burger</button>
    <button id="fries" class="food" onclick="cook('fries')">🍟<br>Fries</button>
    <button id="kebab" class="food" onclick="cook('kebab')">🌯<br>Kebab</button>

    <p id="msg"></p>
  </div>

  <div id="result" class="hidden">
    <h1 id="resultTitle">🏆 YOU WIN!</h1>
    <button class="green" onclick="startGame()">PLAY AGAIN</button>
  </div>
</div>

<script>
let time=60;
let coins=0;
let served=0;
let patience=100;
let order="burger";
let timer;
let patienceTimer;

const foods={
  burger:"🍔 Burger",
  fries:"🍟 Fries",
  kebab:"🌯 Kebab"
};

const cookTime={
  burger:1800,
  fries:1400,
  kebab:2200
};

let state={
  burger:"idle",
  fries:"idle",
  kebab:"idle"
};

function startGame(){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  time=60;
  coins=0;
  served=0;
  patience=100;

  newOrder();
  update();

  clearInterval(timer);
  clearInterval(patienceTimer);

  timer=setInterval(()=>{
    time--;
    update();

    if(time<=0){
      lose();
    }
  },1000);

  patienceTimer=setInterval(()=>{
    patience-=2;
    document.getElementById("fill").style.width=patience+"%";

    if(patience<=0){
      document.getElementById("msg").innerText="Customer left 😢";
      patience=100;
      newOrder();
    }
  },200);
}

function newOrder(){
  const keys=["burger","fries","kebab"];
  order=keys[Math.floor(Math.random()*keys.length)];
  patience=100;
  document.getElementById("order").innerText=foods[order];
  document.getElementById("customer").innerText=["🙂","😋","😁","🤩"][Math.floor(Math.random()*4)];
}

function cook(food){
  const btn=document.getElementById(food);

  if(state[food]==="idle"){
    state[food]="cooking";
    btn.innerHTML=foods[food]+"<br>Cooking... 🔥";

    setTimeout(()=>{
      state[food]="ready";
      btn.classList.add("ready");
      btn.innerHTML=foods[food]+"<br>READY";
    },cookTime[food]);

    return;
  }

  if(state[food]==="ready"){

    if(food===order){
      coins+=50;
      served++;

      document.getElementById("msg").innerText="Perfect! +50 coins";

      state[food]="idle";
      btn.classList.remove("ready");
      btn.innerHTML=foods[food];

      if(served>=5){
        win();
        return;
      }

      newOrder();

    }else{
      document.getElementById("msg").innerText="Wrong order ❌";
    }

    update();
  }
}

function update(){
  document.getElementById("time").innerText=time;
  document.getElementById("coins").innerText=coins;
  document.getElementById("served").innerText=served;
}

function win(){
  clearInterval(timer);
  clearInterval(patienceTimer);

  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("resultTitle").innerText="🏆 YOU WIN!";
}

function lose(){
  clearInterval(timer);
  clearInterval(patienceTimer);

  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("resultTitle").innerText="😢 TIME UP";
}
</script>

</body>
</html>
